# Build and test for tongue's SDKs. emo pulls its task list from
# desert-ant-core's shared model-sdk catalog; tongue defines its own because the
# catalog assumes a Swift-native pipeline behind JNI plus a LiteRT inference
# runtime, and this model has neither — the Kotlin and JavaScript SDKs are direct
# ports, and there is nothing to hand an accelerator. See ANDROID.md.
# Swift 6.2 is the floor, because desert-ant-core depends on JavaScriptKit, whose
# manifest needs 6.2 tooling. emo carries the same floor (its mise pins 6.3.3).
# mise's own swift provider has no macOS build, so the tasks below locate a 6.2
# toolchain themselves: a current Xcode if it has one, otherwise swiftly.

[vars]
model = "tongue"
product = "Tongue"

[env]
# Every task in this repo runs with the usage turnstile off. Without it, each
# `mise run test` and every CI job would post a real load event and count this
# repo's own machines as billable devices. Consumers get reporting on by default;
# see docs/USAGE.md.
DAL_USAGE_DISABLED = "1"

[tasks.test]
description = "Every suite: the golden vectors through all three ports"
depends = ["test-swift", "test-kotlin", "test-js"]

[tasks.examples]
description = "Run the runnable example on each platform"
depends = ["example-swift", "example-kotlin"]

# TongueExample (SwiftUI) and TongueAndroidExample are app projects, run from Xcode
# and `./gradlew :app:installDebug`; only the two console examples are scriptable.

[tasks.example-swift]
dir = "{{ config_root }}/Examples/TongueCLIExample"
run = "bash ../../scripts/with-swift.sh run TongueCLIExample"

[tasks.example-kotlin]
dir = "{{ config_root }}/Examples/TongueKotlinExample"
run = "gradle run --quiet --console=plain"

[tasks.example-web]
description = "Serve the browser example at localhost:8710"
dir = "{{ config_root }}/Examples/TongueWebExample"
tools = { node = "22" }
run = """
( cd ../../packages/tongue-js && npm install --silent && npm run build --silent )
node server.mjs
"""

[tasks.test-swift]
description = "SwiftPM suite (Apple platforms)"
dir = "{{ config_root }}"
run = "bash scripts/with-swift.sh test"

[tasks.test-kotlin]
description = "Golden vectors through the Kotlin port (JVM + Android)"
dir = "{{ config_root }}/packages/tongue-kotlin"
run = "./gradlew build"

[tasks.sync-usage-doc]
description = "Copy docs/USAGE.md into the npm package, which ships it"
hide = true
dir = "{{ config_root }}"
shell = "bash -c"
run = """
set -euo pipefail
# The npm tarball ships USAGE.md so the telemetry opt-out is discoverable from
# inside an installed package. `files` used to be ["dist"] only, so a user had no
# in-package way to find it.
cp docs/USAGE.md packages/tongue-js/USAGE.md
"""

[tasks.test-js]
depends = ["sync-usage-doc"]
# `shell` is explicit on every task below that uses `set -euo pipefail`. mise runs
# a task under /bin/sh unless told otherwise, and on Linux that is dash, which has
# no `pipefail` — so these died with "Illegal option -o pipefail" on a CI runner
# while passing on macOS. That is what stopped the first npm publish: publish-npm
# depends on test-js, test-js aborted before running anything, and the publish
# never happened. CI did not catch it because its jobs call npm directly.
description = "Golden vectors through the JavaScript port (browser + Node)"
dir = "{{ config_root }}/packages/tongue-js"
tools = { node = "22" }
shell = "bash -c"
run = """
set -euo pipefail
npm install --silent
npm test
"""

[tasks.gen-tables]
description = "Regenerate the Unicode script tables in all three ports from the Python reference"
dir = "{{ config_root }}"
shell = "bash -c"
run = """
set -euo pipefail
REF="${TONGUE_REFERENCE:-../tongue-training}"
python3 scripts/gen_swift_tables.py --reference "$REF"
python3 scripts/gen_kotlin_tables.py --reference "$REF"
python3 scripts/gen_ts_tables.py --reference "$REF"
python3 scripts/gen_discard_tables.py --reference "$REF"
python3 scripts/check_tables_agree.py
"""

[tasks.gen-detection-vectors]
description = "Regenerate detection_vectors.json (the head's output) into all three ports"
dir = "{{ config_root }}"
shell = "bash -c"
run = """
set -euo pipefail
# Needs numpy, which the system python3 may not have; the training repo's
# interpreter does. The vectors carry the head's probabilities, so regenerate
# whenever the shipped weights change.
REF="${TONGUE_REFERENCE:-../tongue-training}"
python3 scripts/gen_detection_vectors.py --reference "$REF" --out /tmp/detection_vectors.json
for dest in Tests/TongueTests/Resources packages/tongue-kotlin/src/test/resources packages/tongue-js/test; do
  cp /tmp/detection_vectors.json "$dest/detection_vectors.json"
done
echo "copied into all three ports"
"""

# ---------------------------------------------------------------------- release
#
# Same model as desert-ant-core: `mise run set-version X.Y.Z` bumps every
# artifact, you commit and push `vX.Y.Z`, and each publish workflow ships only the
# artifact whose content changed since the previous tag. The Swift SDK has no
# registry step — SwiftPM resolves the tag straight from the repo.

[tasks.check-version]
hide = true
dir = "{{ config_root }}"
shell = "bash -c"
run = """
set -euo pipefail
v=$(sed -n 's/^version = "\\(.*\\)"$/\\1/p' packages/tongue-kotlin/build.gradle.kts)
[ -n "$v" ] || { echo "error: no version in packages/tongue-kotlin/build.gradle.kts" >&2; exit 1; }
echo "$v"
"""

[tasks.check-version-npm]
hide = true
dir = "{{ config_root }}"
shell = "bash -c"
run = """
set -euo pipefail
v=$(sed -n 's/^  "version": "\\([^"]*\\)",$/\\1/p' packages/tongue-js/package.json)
[ -n "$v" ] || { echo "error: no version in packages/tongue-js/package.json" >&2; exit 1; }
echo "$v"
"""

[tasks.set-version]
description = "Set the tongue artifact versions (ai.desertant:tongue + @desert-ant-labs/tongue)"
dir = "{{ config_root }}"
shell = "bash -c"
usage = '''
arg "<version>" help="Release version (X.Y.Z)"
'''
run = """
set -euo pipefail
# Delegated to a script because the version lives in eight places, not two: the
# two manifests, the two telemetry SDK_VERSION constants (a stale one makes every
# release report the first version in billing), and four install snippets a
# reader copies.
# The script sweeps the repo afterwards and fails if the old version survives
# anywhere, so a new site cannot be forgotten silently.
python3 scripts/set_version.py "${usage_version:?version arg required}"
"""

[tasks.publish-android]
description = "Publish ai.desertant:tongue to Maven Central"
dir = "{{ config_root }}/packages/tongue-kotlin"
depends = ["check-version", "test-kotlin"]
tools = { java = "temurin-21" }
shell = "bash -c"
run = """
set -euo pipefail
# No Android SDK dependency, unlike core's equivalent: this artifact is a plain
# jar, not an AAR, so there is nothing for AGP to build. Credentials arrive as
# Gradle properties via the env, from mise.local.toml locally or the
# `maven-central` GitHub Environment in CI.
: "${ORG_GRADLE_PROJECT_mavenCentralUsername:?set the Central portal token in mise.local.toml}"
: "${ORG_GRADLE_PROJECT_signingInMemoryKey:?set the in-memory GPG signing key in mise.local.toml}"
./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
echo "published: ai.desertant:tongue:$(mise run check-version)"
"""

[tasks.publish-npm]
description = "Publish @desert-ant-labs/tongue to npm"
dir = "{{ config_root }}/packages/tongue-js"
depends = ["check-version-npm", "test-js"]
tools = { node = "22" }
shell = "bash -c"
run = """
set -euo pipefail
# Auth: NPM_TOKEN from mise.local.toml or a CI env, else an interactive
# `npm login`. The token goes through a throwaway userconfig so normal npm
# commands and checked-in files never carry auth.
if [ -n "${NPM_TOKEN:-}" ]; then
    npmrc=$(mktemp)
    trap 'rm -f "$npmrc"' EXIT
    echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$npmrc"
    npm publish --access public --userconfig "$npmrc"
else
    npm publish --access public
fi
echo "published: @desert-ant-labs/tongue@$(mise run check-version-npm)"
"""

[tasks.android-natives]
description = "Cross-compile the C ABI for Android (used by the Node native binding, not by the Kotlin SDK)"
dir = "{{ config_root }}"
shell = "bash -c"
run = """
set -euo pipefail
# The Kotlin SDK is a direct port and needs none of this. Kept because the same C
# ABI backs a future Node native binding, where the ~51 MB static Swift runtime is
# paid once on a server rather than in every app bundle.
export SWIFT_ANDROID_STATIC_BUILD=1
BUNDLE=$(ls -dt "$HOME/Library/org.swift.swiftpm/swift-sdks"/*android*24*.artifactbundle \
                 "$HOME/.swiftpm/swift-sdks"/*android*24*.artifactbundle 2>/dev/null | head -1)
[ -n "$BUNDLE" ] || { echo "error: install the API-24 Swift Android SDK first (see ANDROID.md)" >&2; exit 1; }
for pair in "arm64-v8a:aarch64" "x86_64:x86_64"; do
  abi=${pair%:*}; arch=${pair#*:}
  libdir=$(dirname "$(find "$BUNDLE" -type d -name "swift_static-$arch" | head -1)")
  ln -sfn "swift_static-$arch" "$libdir/swift_static"
  swiftly run swift build -c release --product TongueAndroid \
    --swift-sdk "$arch-unknown-linux-android24" \
    -Xswiftc -static-stdlib -Xswiftc -resource-dir -Xswiftc "$libdir/swift_static" +6.2.0
  dest="build/jniLibs/$abi"; mkdir -p "$dest"
  cp ".build/$arch-unknown-linux-android24/release/libTongueAndroid.so" "$dest/"
  strip_bin=$(find "$HOME/Library/Android/sdk/ndk" -name llvm-strip 2>/dev/null | head -1)
  [ -n "$strip_bin" ] && "$strip_bin" --strip-unneeded "$dest/libTongueAndroid.so"
done
du -sh build/jniLibs/*
"""
