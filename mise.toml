# Build and test for tongue's SDKs. emo pulls its task list from
# desert-ant-core's shared model-sdk catalog; tongue defines its own because the
# catalog assumes a Swift-native pipeline behind JNI plus a LiteRT inference
# runtime, and this model has neither — the Kotlin and JavaScript SDKs are direct
# ports, and there is nothing to hand an accelerator. See ANDROID.md.
# Swift 6.2 is the floor, because desert-ant-core depends on JavaScriptKit, whose
# manifest needs 6.2 tooling. emo carries the same floor (its mise pins 6.3.3).
# mise's own swift provider has no macOS build, so the tasks below locate a 6.2
# toolchain themselves: a current Xcode if it has one, otherwise swiftly.

[vars]
model = "tongue"
product = "Tongue"

[tasks.test]
description = "Every suite: the golden vectors through all three ports"
depends = ["test-swift", "test-kotlin", "test-js"]

[tasks.examples]
description = "Run the runnable example on each platform"
depends = ["example-swift", "example-kotlin"]

[tasks.example-swift]
dir = "{{ config_root }}/Examples/TongueExample"
run = """
if [ -d /Applications/Xcode.app ]; then export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer; fi
swift run
"""

[tasks.example-kotlin]
dir = "{{ config_root }}/Examples/TongueKotlinExample"
run = "gradle run --quiet --console=plain"

[tasks.example-web]
description = "Serve the browser example at localhost:8710"
dir = "{{ config_root }}/Examples/TongueWebExample"
tools = { node = "22" }
run = """
( cd ../../packages/tongue-js && npm install --silent && npm run build --silent )
node server.mjs
"""

[tasks.test-swift]
description = "SwiftPM suite (Apple platforms)"
dir = "{{ config_root }}"
run = '''
set -euo pipefail
# XCTest ships with Xcode, not with CommandLineTools or the OSS toolchains, so
# DEVELOPER_DIR must point at Xcode either way.
if [ -d /Applications/Xcode.app ]; then export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer; fi
# desert-ant-core needs 6.2 tooling to resolve. Use Xcode's swift when it is new
# enough, else swiftly's OSS 6.2 compiler against Xcode's XCTest.
version=$(swift --version 2>/dev/null | sed -n 's/.*Apple Swift version \([0-9]*\.[0-9]*\).*/\1/p')
if [ -n "$version" ] && [ "$(printf '%s\n6.2' "$version" | sort -V | head -1)" = "6.2" ]; then
    swift test
elif command -v swiftly >/dev/null 2>&1; then
    echo "Xcode ships Swift ${version:-unknown}; using swiftly's 6.2.0 for resolution"
    . "$HOME/.swiftly/env.sh"
    swiftly install 6.2.0 --assume-yes >/dev/null 2>&1 || true
    swiftly run swift test +6.2.0
else
    echo "error: Swift 6.2+ required (desert-ant-core needs it). Update Xcode, or install swiftly." >&2
    exit 1
fi
'''

[tasks.test-kotlin]
description = "Golden vectors through the Kotlin port (JVM + Android)"
dir = "{{ config_root }}/packages/tongue-kotlin"
run = "./gradlew build"

[tasks.test-js]
description = "Golden vectors through the JavaScript port (browser + Node)"
dir = "{{ config_root }}/packages/tongue-js"
tools = { node = "22" }
run = """
set -euo pipefail
npm install --silent
npm test
"""

[tasks.gen-tables]
description = "Regenerate the Unicode script tables in all three ports from the Python reference"
dir = "{{ config_root }}"
run = """
set -euo pipefail
REF="${TONGUE_REFERENCE:-../tongue-training}"
python3 scripts/gen_swift_tables.py --reference "$REF"
python3 scripts/gen_kotlin_tables.py --reference "$REF"
python3 scripts/gen_ts_tables.py --reference "$REF"
"""

[tasks.android-natives]
description = "Cross-compile the C ABI for Android (used by the Node native binding, not by the Kotlin SDK)"
dir = "{{ config_root }}"
run = """
set -euo pipefail
# The Kotlin SDK is a direct port and needs none of this. Kept because the same C
# ABI backs a future Node native binding, where the ~51 MB static Swift runtime is
# paid once on a server rather than in every app bundle.
export SWIFT_ANDROID_STATIC_BUILD=1
BUNDLE=$(ls -dt "$HOME/Library/org.swift.swiftpm/swift-sdks"/*android*24*.artifactbundle \
                 "$HOME/.swiftpm/swift-sdks"/*android*24*.artifactbundle 2>/dev/null | head -1)
[ -n "$BUNDLE" ] || { echo "error: install the API-24 Swift Android SDK first (see ANDROID.md)" >&2; exit 1; }
for pair in "arm64-v8a:aarch64" "x86_64:x86_64"; do
  abi=${pair%:*}; arch=${pair#*:}
  libdir=$(dirname "$(find "$BUNDLE" -type d -name "swift_static-$arch" | head -1)")
  ln -sfn "swift_static-$arch" "$libdir/swift_static"
  swiftly run swift build -c release --product TongueAndroid \
    --swift-sdk "$arch-unknown-linux-android24" \
    -Xswiftc -static-stdlib -Xswiftc -resource-dir -Xswiftc "$libdir/swift_static" +6.2.0
  dest="build/jniLibs/$abi"; mkdir -p "$dest"
  cp ".build/$arch-unknown-linux-android24/release/libTongueAndroid.so" "$dest/"
  strip_bin=$(find "$HOME/Library/Android/sdk/ndk" -name llvm-strip 2>/dev/null | head -1)
  [ -n "$strip_bin" ] && "$strip_bin" --strip-unneeded "$dest/libTongueAndroid.so"
done
du -sh build/jniLibs/*
"""
