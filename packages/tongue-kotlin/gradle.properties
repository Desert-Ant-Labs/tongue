org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
# Dokka 2.x still defaults to its deprecated V1 task graph; V2 is what exposes
# dokkaGeneratePublicationHtml, which the publish block turns into the javadoc jar.
